apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservice-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: microservice-platform
    app.kubernetes.io/part-of: fintech-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    description: "Aplicación principal de microservicios para la plataforma fintech"
    notifications.argoproj.io/subscribe.on-deployed: slack-notifications
    notifications.argoproj.io/subscribe.on-sync-failed: slack-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/fintech-platform/deployments.git
    targetRevision: main
    path: charts/microservice
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: latest
        - name: autoscaling.enabled
          value: "true"
        - name: autoscaling.minReplicas
          value: "3"
        - name: autoscaling.maxReplicas
          value: "20"
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /data
  revisionHistoryLimit: 10